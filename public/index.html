<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>feeda</title>
  <link rel="stylesheet" href="./static/css/style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="./static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="feeda">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="setup-screen" class="setup-screen hidden">
    <div class="setup-card">
      <h1>feeda セットアップ</h1>
      <p>
        購読リストと既読状況は、あなたの端末にある「シード」から作った鍵でのみ復号できます。
        サーバーはシードを保存しないため、<strong>シードを失うと同期データには二度とアクセスできません</strong>。
        安全な場所に保管してください。
      </p>
      <div class="setup-row">
        <button id="generate-seed-btn" type="button">新しいシードを生成</button>
      </div>
      <label class="setup-label">
        シード
        <input id="seed-input" type="text" placeholder="生成するか、既存のシードを貼り付け" autocomplete="off">
      </label>
      <label class="setup-label">
        APIベースURL（このWebアプリとAPIを同じドメインで公開している場合は空欄のままでOK）
        <input id="api-base-input" type="text" placeholder="別ドメインの場合のみ入力: https://your-app.vercel.app" autocomplete="off">
      </label>
      <div id="setup-error" class="setup-error"></div>
      <button id="start-btn" type="button" class="primary">開始</button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button type="button" id="brand-btn" class="brand" title="クリックで全画面表示を切り替え">feeda</button>
      <input id="search-input" type="search" class="search-input" placeholder="フィード名・記事名・本文を検索" autocomplete="off">
      <button type="button" id="seed-btn" title="シードとAPIベースURLを表示">シード</button>
      <button type="button" id="mode-toggle-btn" class="mode-toggle-btn">振り返る</button>
    </header>
    <button type="button" id="next-fetch-bar" class="next-fetch-bar hidden">
      次回取得: <span id="next-fetch-time">--:--</span>（タップで今すぐ取得）
    </button>
    <div class="panes">
      <aside class="pane feed-pane" id="feed-pane">
        <div id="feed-list"></div>
      </aside>
      <div class="pane-resizer" data-resizer="0"></div>
      <section class="pane article-pane" id="article-pane">
        <div id="article-list"></div>
      </section>
      <div class="pane-resizer" data-resizer="1"></div>
      <section class="pane preview-pane" id="preview-pane">
        <div id="preview"></div>
      </section>
    </div>
    <div class="mobile-view" id="mobile-view">
      <div id="mobile-article-list" class="mobile-article-list"></div>
    </div>
    <div class="reflect-view" id="reflect-view">
      <div class="reflect-day-nav">
        <button type="button" id="reflect-prev-day" aria-label="前の日">←</button>
        <span id="reflect-date-label" class="reflect-date-label"></span>
        <button type="button" id="reflect-next-day" aria-label="次の日">→</button>
        <button type="button" id="reflect-today-btn">今日</button>
      </div>
      <div id="reflect-timeline" class="reflect-timeline"></div>
    </div>
    <div id="status-bar" class="status-bar hidden">
      <div id="status-bar-fill" class="status-bar-fill"></div>
      <span id="status-bar-text" class="status-bar-text"></span>
    </div>
  </div>

  <div id="seed-modal" class="modal hidden">
    <div class="modal-card">
      <h1>シード</h1>
      <p>
        購読データの復号鍵はこのシードから作られます。安全な場所に保管してください。
        別端末やTampermonkeyスクリプトに同じシードを設定すると、同じ同期データにアクセスできます。
      </p>
      <label class="setup-label">
        シード
        <input id="seed-display" type="text" readonly>
      </label>
      <label class="setup-label">
        APIベースURL
        <input id="seed-modal-api-base" type="text" readonly>
      </label>
      <div class="setup-row">
        <button id="seed-copy-btn" type="button">コピー</button>
        <button id="seed-modal-close-btn" type="button" class="primary">閉じる</button>
      </div>
    </div>
  </div>

  <!--
    Classic (non-module) script: unlike the deferred `main.js` module below,
    this runs synchronously the instant the parser reaches it — before the
    browser gets a chance to paint the setup screen — so which screen starts
    visible is decided before first paint instead of flashing setup-screen
    and then swapping to the app a moment later. Must come after both
    #setup-screen and #app so getElementById can actually find them.
  -->
  <script>
    if (localStorage.getItem("feeda:seed")) {
      document.getElementById("app").classList.remove("hidden");
    } else {
      document.getElementById("setup-screen").classList.remove("hidden");
    }
  </script>

  <script type="module" src="./static/js/main.js"></script>
</body>
</html>
